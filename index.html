<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Home Assistant</title>
<style>
  body { background:#111; color:#eee; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0; gap:24px; }
  a.button { display:block; background:#03a9f4; color:#fff; font-size:28px; font-weight:600; text-decoration:none; padding:28px 44px; border-radius:14px; }
  a.small { color:#9e9e9e; font-size:14px; }
</style>
</head>
<body>
  <a class="button" href="http://192.168.40.191">Open Home Assistant</a>
  <a class="small" href="?go=1">Auto-redirect version</a>
<script>
  if (new URLSearchParams(location.search).get('go') === '1') {
    document.body.innerHTML = '<p style="font-size:20px">Opening Home Assistant...</p>';
    window.location.replace('http://192.168.40.191');
  }
</script>
</body>
</html>
